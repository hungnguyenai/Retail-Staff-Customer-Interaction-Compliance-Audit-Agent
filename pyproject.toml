[project]
name = "ret-c2-108"
version = "0.1.0"
description = "RET-C2-108 Retail Staff Interaction Compliance Audit Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repo arm — a stub package on PYTHONPATH,
# or installed from the package registry for wheel-era repos (see the dual-mode
# run-tests CI job). Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
# MYPY-UNTYPED-WHEEL — temporary. The AgentCore wheel ships no py.typed marker, so
# mypy resolves every framework symbol to Any. disallow_subclassing_any must be relaxed
# in this package's own checked context: an override scoped to the imported modules
# cannot suppress the error, which is raised where this package declares the subclass.
# Every other strict setting stays on. Remove once the wheel ships real type information.
python_version = "3.11"
strict = true
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true
